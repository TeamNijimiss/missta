<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f2f3f5" />
    <style>
      :root { background: #f2f3f5; color-scheme: light; }
      :root[data-theme='dark'] { background: #0f1115; color-scheme: dark; }
    </style>
    <script>
      // Apply before the app bundle loads; keep the defaults in sync with ThemeProvider.
      (() => {
        let mode = 'auto';
        try {
          const settings = JSON.parse(localStorage.getItem('missta.settings') || '{}');
          if (settings?.themeMode === 'light' || settings?.themeMode === 'dark') mode = settings.themeMode;
        } catch {}
        const theme = mode === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0f1115' : '#f2f3f5');
      })();
    </script>
    <title>みすすた！β</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
